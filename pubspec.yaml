name: epub_reader
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  logger: ^2.6.2
  get_storage: ^2.1.1

  dio: ^5.4.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
